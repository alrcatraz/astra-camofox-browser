name: Release camofox image (astra)

# Tag v* -> build+smoke on NAS host runner -> publish ghcr.io (if PAT baked)
# -> create Gitea release entry. Credentials: /volume1/docker/ci-clone-token
# and /volume1/docker/ci-ghcr-pat (host files; secrets API unavailable).

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: camofox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: host
    steps:
      - name: Clone tagged repo (NAS host)
        shell: bash
        run: |
          set -euo pipefail
          WORK=/volume1/docker/ci-camofox-rel
          rm -rf "$WORK"; mkdir -p "$WORK"
          TOK=$(cat /volume1/docker/act_runner_nix/data/ci-clone-token)
          GIT_SSL_NO_VERIFY=true git clone --branch "${{ gitea.ref_name }}" \
            "https://alrcatraz:${TOK}@git01.wrt.astra-lab.org:10443/${{ gitea.repository }}.git" "$WORK/repo"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Build & smoke
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/repo"
          TAG="localhost/camofox-browser:${{ gitea.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f Dockerfile.astra -t "$TAG" . 2>&1 | tail -5
          C=$(docker run -d --rm -e CAMOFOX_API_KEY=*** -p 19378:9377 "$TAG")
          trap 'docker rm -f $C 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 15); do sleep 2
            L=$(docker logs $C 2>&1 || true)
            echo "$L" | grep -q 'persistence plugin enabled' && { ok=1; break; }
          done
          [ -n "$ok" ] || { echo "::error::persistence not loaded"; exit 1; }
          curl -sf -X POST http://127.0.0.1:19378/tabs -H 'Content-Type: application/json' \
            -d '{"userId":"rel_smoke","sessionKey":"s","url":"https://example.com"}' >/dev/null
          sleep 3; curl -sf -X DELETE http://127.0.0.1:19378/sessions/rel_smoke >/dev/null; sleep 3
          docker logs $C 2>&1 | grep -q 'storage state persisted' || { echo "::error::no checkpoint"; exit 1; }
          echo SMOKE_OK

      - name: Publish to ghcr.io (skips without PAT file)
        shell: bash
        run: |
          set -euo pipefail
          PAT=$(cat /volume1/docker/ci-ghcr-pat 2>/dev/null || true)
          if [ -z "$PAT" ]; then echo "SKIP_GHCR (create /volume1/docker/ci-ghcr-pat to enable)"; exit 0; fi
          echo "$PAT" | docker login ghcr.io -u alrcatraz --password-stdin
          docker tag "$TAG" "ghcr.io/alrcatraz/astra-camofox-browser:${{ gitea.ref_name }}"
          docker tag "$TAG" "ghcr.io/alrcatraz/astra-camofox-browser:latest"
          docker push "ghcr.io/alrcatraz/astra-camofox-browser:${{ gitea.ref_name }}"
          docker push "ghcr.io/alrcatraz/astra-camofox-browser:latest"

      - name: Create Gitea release entry
        shell: bash
        run: |
          set -euo pipefail
          TOK=$(cat /volume1/docker/act_runner_nix/data/ci-clone-token)
          curl -sf -u "alrcatraz:${TOK}" -X POST \
            "https://git01.wrt.astra-lab.org:10443/api/v1/repos/${{ gitea.repository }}/releases" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${{ gitea.ref_name }}\",\"name\":\"camofox-browser ${{ gitea.ref_name }}\",\"body\":\"Image: localhost/camofox-browser:live on NAS; ghcr.io/alrcatraz/astra-camofox-browser:${{ gitea.ref_name }} when PAT configured\"}" | head -c 200; echo
