name: Release camofox image (astra)

# Tag vX.Y.Z.astra.N -> GitHub Container Registry publish + Gitea release.
# Runs on NAS nix-capable runner via act; ghcr login uses GH_TOKEN from the
# baked-in clone-token file's companion secret (set once in KeePass, see AGENTS).

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: camofox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: host
    steps:
      - name: Clone tagged repo (NAS host)
        run: |
          set -euo pipefail
          WORK=/volume1/docker/ci-camofox-rel
          rm -rf "$WORK"; mkdir -p "$WORK"
          TOK=$(cat /volume1/docker/ci-clone-token)
          git clone --branch "${{ gitea.ref_name }}" "https://alrcatraz:${TOK}@git01.wrt.astra-lab.org:10443/${{ gitea.repository }}.git" "$WORK/repo"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Build & smoke (same gates as CI)
        run: |
          set -euo pipefail
          cd "$WORK/repo"
          TAG="localhost/camofox-browser:${{ gitea.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sudo -n docker build -f Dockerfile.astra -t "$TAG" . 2>&1 | tail -5
          C=$(sudo -n docker run -d --rm -e CAMOFOX_API_KEY=*** -p 19378:9377 "$TAG")
          trap 'sudo -n docker rm -f $C 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 15); do sleep 2
            L=$(sudo -n docker logs $C 2>&1 || true)
            echo "$L" | grep -q 'persistence plugin enabled' && { ok=1; break; }
          done
          [ -n "$ok" ] || { echo "::error::persistence not loaded"; exit 1; }
          curl -sf -X POST http://127.0.0.1:19378/tabs -H 'Content-Type: application/json' \
            -d '{"userId":"rel_smoke","sessionKey":"s","url":"https://example.com"}' >/dev/null
          sleep 3; curl -sf -X DELETE http://127.0.0.1:19378/sessions/rel_smoke >/dev/null; sleep 3
          sudo -n docker logs $C 2>&1 | grep -q 'storage state persisted' || { echo "::error::no checkpoint"; exit 1; }
          echo SMOKE_OK

      - name: Publish to ghcr.io (if token present)
        run: |
          set -euo pipefail
          PAT=$(cat /volume1/docker/ci-ghcr-pat 2>/dev/null || true)
          if [ -z "$PAT" ]; then echo "SKIP_GHCR (no /volume1/docker/ci-ghcr-pat)"; exit 0; fi
          echo "$PAT" | sudo -n docker login ghcr.io -u alrcatraz --password-stdin
          sudo -n docker tag "$TAG" "ghcr.io/alrcatraz/astra-camofox-browser:${{ gitea.ref_name }}"
          sudo -n docker tag "$TAG" "ghcr.io/alrcatraz/astra-camofox-browser:latest"
          sudo -n docker push "ghcr.io/alrcatraz/astra-camofox-browser:${{ gitea.ref_name }}"
          sudo -n docker push "ghcr.io/alrcatraz/astra-camofox-browser:latest"

      - name: Create Gitea release entry
        run: |
          set -euo pipefail
          TOK=$(cat /volume1/docker/ci-clone-token)
          curl -sf -u "alrcatraz:${TOK}" -X POST \
            "https://git01.wrt.astra-lab.org:10443/api/v1/repos/${{ gitea.repository }}/releases" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${{ gitea.ref_name }}\",\"name\":\"camofox-browser ${{ gitea.ref_name }}\",\"body\":\"Image: ghcr.io/alrcatraz/astra-camofox-browser:${{ gitea.ref_name }}\"}" | head -c 200; echo
