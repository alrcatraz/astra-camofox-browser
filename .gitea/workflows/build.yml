name: Build & publish camofox image (astra)

# Standard-era CI (2026-09-21). Runner config now gives jobs: docker.sock mount,
# privileged, network_mode=host (officially documented act_runner options — see
# docs.gitea.com/runner/configuration). No more dlib/REST relay/volume hacks.
#
# Job image = node:22-bookworm (label nix-capable): has git/node/npm natively;
# apt-get available for the node-gyp toolchain. Docker CLI comes from the
# mounted socket (plain `docker` binary NOT present -> use DOCKER_HOST via
# socket: docker commands run through the `docker:cli` container? No — job is
# privileged+host-net with socket; we install docker-cli via apt when needed.)
#
# Flow: checkout -> npm ci + jest (gates) -> thin-layer docker build over VNC
# base -> smoke (persistence load + checkpoint persist) -> :live tag -> cleanup.

on:
  push:
    branches: [astra]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

env:
  VNC_BASE: localhost/camofox-browser:135.0.1-x86_64-vnc

jobs:
  test:
    runs-on: nix-capable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq python3 make g++ git >/dev/null
          node --version && npm --version

      - name: npm ci
        run: |
          set -euo pipefail
          HOME=/tmp npm ci --no-audit --no-fund

      - name: Jest (unit + plugins)
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          set -euo pipefail
          HOME=/tmp node ./node_modules/.bin/jest plugins tests/unit \
            --testPathIgnorePatterns cookies security tabRecycling tabLifecycleContract operationalFailures vnc-watcher \
            --silent --forceExit 2>&1 | tee /tmp/jest.out
          grep -E "Test Suites:" /tmp/jest.out
          grep -E "^Tests:" /tmp/jest.out
          SUITES=$(grep -E "Test Suites:" /tmp/jest.out | head -1)
          TESTS=$(grep -E "^Tests:" /tmp/jest.out | head -1)
          case "$SUITES$TESTS" in *failed*) echo "::error::tests failed"; exit 1;; esac
          case "$SUITES" in *" passed, "*total*) ;; *) echo "::error::no suites summary"; exit 1;; esac
          echo TEST-GATE-PASSED

  build-smoke:
    needs: test
    runs-on: nix-capable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain (incl docker-cli)
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq git curl ca-certificates >/dev/null
          if ! command -v docker >/dev/null 2>&1; then
            mkdir -p /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg -o /tmp/d.gpg
            install -m 0755 /tmp/d.gpg /etc/apt/keyrings/docker.gpg
            echo "deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
            apt-get update -qq && apt-get install -y -qq docker-ce-cli >/dev/null
          fi
          docker version

      - name: Thin-layer build over VNC base
        run: |
          set -euo pipefail
          VERSION=$(grep -oE '"version": *"[0-9]+\.[0-9]+\.[0-9]+"' package.json | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          [ -n "$VERSION" ] || { echo "::error::no version"; exit 1; }
          SHA="${{ gitea.sha }}"
          TAG="localhost/camofox-browser:${VERSION}-x86_64-vnc-ci-${SHA:0:7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker images | grep -F "$VNC_BASE" || { echo "::error::VNC base missing on NAS"; exit 1; }
          docker build -f Dockerfile.astra -t "$TAG" .
          echo BUILD_OK

      - name: Smoke — persistence loads + checkpoint persists
        run: |
          set -euo pipefail
          CID=$(docker create --rm --label ci-smoke=1 -e CAMOFOX_API_KEY=*** "$TAG")
          trap "docker rm -f $CID >/dev/null 2>&1 || true" EXIT
          docker start "$CID" >/dev/null
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CID")
          [ -n "$IP" ] || { echo "::error::no ip"; docker logs "$CID" | tail -30; exit 1; }
          ok=""
          for i in $(seq 1 15); do
            sleep 2
            docker logs "$CID" 2>&1 | grep -q "persistence plugin enabled" && { ok=1; break; }
            docker logs "$CID" 2>&1 | grep -q "plugin load failed.*persistence" && { echo "::error::persistence load failed"; docker logs "$CID" | tail -20; exit 1; }
          done
          [ -n "$ok" ] || { echo "::error::persistence never loaded"; docker logs "$CID" | tail -30; exit 1; }
          TABCODE=$(curl -s -o /tmp/tab.json -w "%{http_code}" -H "Authorization: Bearer ***" -m 120 --retry 5 --retry-delay 5 --retry-all-errors -X POST "http://$IP:9377/tabs" -H "Content-Type: application/json" -d '{"userId":"ci_smoke","sessionKey":"s","url":"https://example.com"}')
          [ "$TABCODE" = "200" ] || { echo "::error::tab create http=$TABCODE body=$(head -c 300 /tmp/tab.json)"; docker logs "$CID" | tail -30; exit 1; }
          sleep 3
          curl -sf -m 15 -H "Authorization: Bearer ***" -X DELETE "http://$IP:9377/sessions/ci_smoke" >/dev/null
          sleep 3
          docker logs "$CID" 2>&1 | grep -q "storage state persisted" || { echo "::error::checkpoint not persisted"; docker logs "$CID" | tail -30; exit 1; }
          docker rm -f "$CID" >/dev/null 2>&1 || true
          trap - EXIT
          echo SMOKE_OK

      - name: Publish :live tag on NAS
        run: |
          set -euo pipefail
          docker tag "$TAG" localhost/camofox-browser:live
          echo "Published $TAG as :live (NAS-local)."
