name: Build & publish camofox image (astra)

# Toolchain = repo flake.nix + committed flake.lock, evaluated inside the
# `nixos` label (nixos/nix:runner-ci). No apt/npm-image toolchain drift.
# Runner config gives jobs: docker.sock mount, privileged, network_mode=host
# (docs.gitea.com/runner/configuration). Image build/publish uses the mounted
# docker socket via a throwaway `docker:cli` container (act forbids *actions*
# from using docker: images as runs-on — they resolve through gitee mirrors).
#
# Flow: checkout -> nix develop (flake ci shell): npm ci + jest gates ->
# docker thin-layer build over VNC base -> smoke (persistence load +
# checkpoint persist) -> :live tag -> prune stale ci tags.

on:
  push:
    branches: [astra]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

env:
  VNC_BASE: localhost/camofox-browser:135.0.1-x86_64-vnc
  NIX_CONFIG: "experimental-features = nix-command flakes access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

jobs:
  test:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flake devShell gate
        run: |
          set -euo pipefail
          git add -N flake.nix || true
          nix develop .#ci --command bash -c 'node --version && npm --version && gcc --version | head -1'

      - name: npm ci (in flake shell)
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c 'HOME=/tmp npm ci --no-audit --no-fund'

      - name: Jest (unit + plugins, in flake shell)
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            HOME=/tmp NODE_OPTIONS=$NODE_OPTIONS node ./node_modules/.bin/jest plugins tests/unit \
              --testPathIgnorePatterns cookies security tabRecycling tabLifecycleContract operationalFailures vnc-watcher \
              --silent --forceExit 2>&1 | tee /tmp/jest.out
            grep -E "Test Suites:" /tmp/jest.out
            grep -E "^Tests:" /tmp/jest.out
            SUITES=$(grep -E "Test Suites:" /tmp/jest.out | head -1)
            TESTS=$(grep -E "^Tests:" /tmp/jest.out | head -1)
            case "$SUITES$TESTS" in *failed*) echo "::error::tests failed"; exit 1;; esac
            case "$SUITES" in *" passed, "*total*) ;; *) echo "::error::no suites summary"; exit 1;; esac
            echo TEST-GATE-PASSED
          '

  build-smoke:
    needs: test
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flake devShell gate
        run: |
          set -euo pipefail
          git add -N flake.nix || true
          nix develop .#ci --command bash -c 'node --version && git --version'

      - name: Docker CLI probe (docker:cli helper on shared socket)
        run: |
          set -euo pipefail
          D() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --network host docker:cli "$@"; }
          D version >/dev/null
          echo DOCKER-CLI-OK

      - name: Thin-layer build over VNC base
        run: |
          set -euo pipefail
          VERSION=$(grep -oE '"version": *"[0-9]+\.[0-9]+\.[0-9]+"' package.json | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          [ -n "$VERSION" ] || { echo "::error::no version"; exit 1; }
          SHA="${{ gitea.sha }}"
          TAG="localhost/camofox-browser:${VERSION}-x86_64-vnc-ci-${SHA:0:7}"
          # GITHUB_ENV is not honored by act here -> persist via file
          echo "$TAG" > /tmp/ci_tag
          D() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --network host docker:cli "$@"; }
          D image inspect "$VNC_BASE" >/dev/null 2>&1 || { echo "::error::VNC base missing on NAS"; D images | grep camofox | head -5; exit 1; }
          # Dockerfile.astra is a thin layer over the VNC base (which carries its own
          # node_modules); CI checkout has none, so drop that COPY for the CI build.
          grep -v "^COPY node_modules" Dockerfile.astra > Dockerfile.ci
          # The daemon lives on the NAS host; the job workspace is itself a host
          # bind volume, so its $GITHUB_WORKSPACE path is valid there too — pass it
          # through a docker:cli container for both -f and the build context.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --network host \
            docker:cli build -f "$GITHUB_WORKSPACE/Dockerfile.ci" -t "$TAG" "$GITHUB_WORKSPACE"
          echo BUILD_OK

      - name: Smoke — persistence loads + checkpoint persists
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/ci_tag)
          D() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --network host docker:cli "$@"; }
          # smoke key: ephemeral per-run. Any literal matching the log scrubber's
          # secret pattern gets rewritten to *** in the *executed script too*,
          # so build it from runtime pieces and never name it *_KEY inline.
          SK="ci-$RANDOM-$$"
          printf "Authorization: Bearer ***" "$SK" > /tmp/ci_auth_hdr
          # both gates: access-key middleware 401s before route auth
          CID=$(D create --rm --label ci-smoke=1 -e CAMOFOX_API_KEY="$SK" -e CAMOFOX_ACCESS_KEY="$SK" "$TAG")
          trap "D rm -f $CID >/dev/null 2>&1 || true" EXIT
          D start "$CID" >/dev/null
          IP=$(D inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CID" | tr -d '\n')
          [ -n "$IP" ] || { echo "::error::no ip"; D logs "$CID" | tail -30; exit 1; }
          ok=""
          for i in $(seq 1 15); do
            sleep 2
            D logs "$CID" 2>&1 | grep -q "persistence plugin enabled" && { ok=1; break; }
            D logs "$CID" 2>&1 | grep -q "plugin load failed.*persistence" && { echo "::error::persistence load failed"; D logs "$CID" | tail -20; exit 1; }
          done
          [ -n "$ok" ] || { echo "::error::persistence never loaded"; D logs "$CID" | tail -30; exit 1; }
          TABCODE=$(curl -s -o /tmp/tab.json -w "%{http_code}" -H @/tmp/ci_auth_hdr -m 120 --retry 5 --retry-delay 5 --retry-all-errors -X POST "http://$IP:9377/tabs" -H "Content-Type: application/json" -d '{"userId":"ci_smoke","sessionKey":"s","url":"https://example.com"}')
          [ "$TABCODE" = "200" ] || { echo "::error::tab create http=$TABCODE body=$(head -c 300 /tmp/tab.json)"; D logs "$CID" | tail -30; exit 1; }
          sleep 3
          curl -sf -m 15 -H @/tmp/ci_auth_hdr -X DELETE "http://$IP:9377/sessions/ci_smoke" >/dev/null
          sleep 3
          D logs "$CID" 2>&1 | grep -q "storage state persisted" || { echo "::error::checkpoint not persisted"; D logs "$CID" | tail -30; exit 1; }
          D rm -f "$CID" >/dev/null 2>&1 || true
          trap - EXIT
          echo SMOKE_OK

      - name: Publish :live + version tags on NAS
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/ci_tag)
          D() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --network host docker:cli "$@"; }
          D tag "$TAG" localhost/camofox-browser:live
          # release.yml builds its own image from the tag checkout; reuse it here so
          # `git tag v1.13.2` costs one build, not two (same commit = same layers)
          if V=$(git describe --tags --exact-match 2>/dev/null); then
            PV=$(nix develop .#ci --command bash -c "node -p \"require('./package.json').version\"")
            [ "$V" = "$PV" ] || { echo "::error::tag $V != package.json version $PV — bump package.json on the tagged commit"; exit 1; }
            D tag "$TAG" "localhost/camofox-browser:$V"
            echo "Also tagged $TAG as :$V"
          fi
          # drop stale per-commit CI tags so daemon storage doesn't bloat
          for t in $(D images --format "{{.Tag}}" localhost/camofox-browser | grep -E "^1\.[0-9]+\.[0-9]+-x86_64-vnc-ci-" | grep -v "${TAG##*:}"); do
            D rmi "localhost/camofox-browser:$t" >/dev/null 2>&1 || true
          done
          echo "Published $TAG as :live (NAS-local); old ci tags pruned."
