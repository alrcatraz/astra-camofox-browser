name: Build & publish camofox image (astra)

# Standard-era CI (2026-09-21). Runner config now gives jobs: docker.sock mount,
# privileged, network_mode=host (officially documented act_runner options — see
# docs.gitea.com/runner/configuration). No more dlib/REST relay/volume hacks.
#
# Job image = node:22-bookworm (label nix-capable): has git/node/npm natively;
# apt-get available for the node-gyp toolchain. Docker CLI comes from the
# mounted socket (plain `docker` binary NOT present -> use DOCKER_HOST via
# socket: docker commands run through the `docker:cli` container? No — job is
# privileged+host-net with socket; we install docker-cli via apt when needed.)
#
# Flow: checkout -> npm ci + jest (gates) -> thin-layer docker build over VNC
# base -> smoke (persistence load + checkpoint persist) -> :live tag -> cleanup.

on:
  push:
    branches: [astra]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

env:
  VNC_BASE: localhost/camofox-browser:135.0.1-x86_64-vnc

jobs:
  test:
    runs-on: nix-capable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq python3 make g++ git >/dev/null
          node --version && npm --version

      - name: npm ci
        run: |
          set -euo pipefail
          HOME=/tmp npm ci --no-audit --no-fund

      - name: Jest (unit + plugins)
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          set -euo pipefail
          HOME=/tmp node ./node_modules/.bin/jest plugins tests/unit \
            --testPathIgnorePatterns cookies security tabRecycling tabLifecycleContract operationalFailures vnc-watcher \
            --silent --forceExit 2>&1 | tee /tmp/jest.out
          grep -E "Test Suites:" /tmp/jest.out
          grep -E "^Tests:" /tmp/jest.out
          SUITES=$(grep -E "Test Suites:" /tmp/jest.out | head -1)
          TESTS=$(grep -E "^Tests:" /tmp/jest.out | head -1)
          case "$SUITES$TESTS" in *failed*) echo "::error::tests failed"; exit 1;; esac
          case "$SUITES" in *" passed, "*total*) ;; *) echo "::error::no suites summary"; exit 1;; esac
          echo TEST-GATE-PASSED

  build-smoke:
    needs: test
    runs-on: nix-capable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain (incl docker-cli)
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq git curl ca-certificates docker.io >/dev/null
          docker version

      - name: Thin-layer build over VNC base
        run: |
          set -euo pipefail
          VERSION=$(grep -oE '"version": *"[0-9]+\.[0-9]+\.[0-9]+"' package.json | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          [ -n "$VERSION" ] || { echo "::error::no version"; exit 1; }
          SHA="${{ gitea.sha }}"
          TAG="localhost/camofox-browser:${VERSION}-x86_64-vnc-ci-${SHA:0:7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # GITHUB_ENV is not honored by this act build (proven runs #41/#45) -> persist via file
          echo "$TAG" > /tmp/ci_tag
          docker image inspect "$VNC_BASE" >/dev/null 2>&1 || { echo "::error::VNC base missing on NAS"; docker images | grep camofox | head -5; exit 1; }
          # Dockerfile.astra is a thin layer over the VNC base (which carries its own
          # node_modules); CI checkout has none, so drop that COPY for the CI build.
          grep -v "^COPY node_modules" Dockerfile.astra > Dockerfile.ci
          docker build -f Dockerfile.ci -t "$TAG" .
          echo BUILD_OK

      - name: Smoke — persistence loads + checkpoint persists
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/ci_tag)
          # smoke key: ephemeral per-run. Any literal that matches the log scrubber's
          # secret pattern gets rewritten to *** in the *executed script too* (run#130/131),
          # so build the env flag from runtime pieces and never name it *_KEY inline.
          SK="ci-$RANDOM-$$"
          printf "Authorization: Bearer %s\n" "$SK" > /tmp/ci_auth_hdr
          # set both gates in one step (access-key middleware 401s before route auth):
          ENVF="-e CAMOFOX_API_KEY=$SK -e CAMOFOX_ACCESS_KEY=$SK"
          CID=$(docker create --rm --label ci-smoke=1 $ENVF "$TAG")
          trap "docker rm -f $CID >/dev/null 2>&1 || true" EXIT
          docker start "$CID" >/dev/null
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CID")
          [ -n "$IP" ] || { echo "::error::no ip"; docker logs "$CID" | tail -30; exit 1; }
          ok=""
          for i in $(seq 1 15); do
            sleep 2
            docker logs "$CID" 2>&1 | grep -q "persistence plugin enabled" && { ok=1; break; }
            docker logs "$CID" 2>&1 | grep -q "plugin load failed.*persistence" && { echo "::error::persistence load failed"; docker logs "$CID" | tail -20; exit 1; }
          done
          [ -n "$ok" ] || { echo "::error::persistence never loaded"; docker logs "$CID" | tail -30; exit 1; }
          TABCODE=$(curl -s -o /tmp/tab.json -w "%{http_code}" -H @/tmp/ci_auth_hdr -m 120 --retry 5 --retry-delay 5 --retry-all-errors -X POST "http://$IP:9377/tabs" -H "Content-Type: application/json" -d '{"userId":"ci_smoke","sessionKey":"s","url":"https://example.com"}')
          [ "$TABCODE" = "200" ] || { echo "::error::tab create http=$TABCODE body=$(head -c 300 /tmp/tab.json)"; docker logs "$CID" | tail -30; exit 1; }
          sleep 3
          curl -sf -m 15 -H @/tmp/ci_auth_hdr -X DELETE "http://$IP:9377/sessions/ci_smoke" >/dev/null
          sleep 3
          docker logs "$CID" 2>&1 | grep -q "storage state persisted" || { echo "::error::checkpoint not persisted"; docker logs "$CID" | tail -30; exit 1; }
          docker rm -f "$CID" >/dev/null 2>&1 || true
          trap - EXIT
          echo SMOKE_OK

      - name: Publish :live + version tags on NAS
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/ci_tag)
          docker tag "$TAG" localhost/camofox-browser:live
          # release.yml builds its own image from the tag checkout; reuse it here so
          # `git tag v1.13.2` costs one build, not two (same commit = same layers)
          if V=$(git describe --tags --exact-match 2>/dev/null); then
            PV="v$(node -p "require('./package.json').version")"
            [ "$V" = "$PV" ] || { echo "::error::tag $V != package.json version $PV — bump package.json on the tagged commit"; exit 1; }
            docker tag "$TAG" "localhost/camofox-browser:$V"
            echo "Also tagged $TAG as :$V"
          fi
          # drop stale per-commit CI tags so the daemon storage doesn't bloat;
          # keep only what we just built + :live
          for t in $(docker images --format "{{.Tag}}" localhost/camofox-browser | grep -E "^1\.[0-9]+\.[0-9]+-x86_64-vnc-ci-" | grep -v "${TAG##*:}"); do
            docker rmi "localhost/camofox-browser:$t" >/dev/null 2>&1 || true
          done
          echo "Published $TAG as :live (NAS-local); old ci tags pruned."
