name: Build & publish camofox image (astra)

# Flake-based CI (decided 2026-09-20): the toolchain is NO LONGER baked into a
# mutable local image (`nixos/nix:runner-ci` was silently wiped by Container
# Manager GC — runs #41+). Jobs run on `nix-capable` -> official
# `nixos/nix:latest` (GC-safe, has /nix + nix 2.35.2), and every step enters
# the repo's pinned dev shell: `nix develop .#ci`. Reproducible, auditable,
# survives any image GC.
#
# Proven environment facts (runs #37–#49, do not re-litigate):
#   - ONLY the job container resolves gitea:3000; sibling helper containers
#     live on the default bridge (no DNS, no Lucky hairpin).
#   - The job workspace is invisible to sibling containers even via its host
#     path (act's dirs live in the runner CONTAINER namespace). Never bind
#     job paths into docker-run helpers.
#   - act_runner v0.6.1: GITHUB_ENV does NOT carry across steps; single quotes
#     in run blocks get mangled by Go format() — use double quotes only.
#   - pipefail + inherited SIGPIPE=ignore kills git/tail with exit 141 —
#     `trap "" PIPE` at the top of every step.
#   - Token source of truth: host file mounted read-only into jobs at
#     /root/ci-clone-token by the runner config (baked-image copies are gone).

on:
  push:
    branches: [astra]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

jobs:
  test:
    runs-on: nix-capable
    steps:
      - name: Unit tests in pinned flake shell
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          export NIX_CONFIG="experimental-features = nix-command flakes"
          TOK=$(cat /jobdata/ci-clone-token)
          rm -rf ci-repo && mkdir ci-repo
          git config --global http.sslVerify false
          git clone --quiet --branch "${{ gitea.ref_name }}" \
            "http://alrcatraz:${TOK}@gitea:3000/${{ gitea.repository }}.git" ci-repo > /tmp/clone.log 2>&1 || { cat /tmp/clone.log; exit 1; }
          cd ci-repo && git checkout --quiet "${{ gitea.sha }}"
          echo "=== flake lock: resolving toolchain (cached after first run) ==="
          nix develop .#ci --command bash -c "
            node --version && gcc --version | head -1
            npm ci --no-audit --no-fund 2>&1 | tail -3
            env NODE_OPTIONS=--experimental-vm-modules npx jest plugins \
              tests/unit --testPathIgnorePatterns='cookies|security|tabRecycling|tabLifecycleContract|operationalFailures|vnc-watcher' \
              --silent --forceExit > /tmp/jest.log 2>&1 || true
            grep -E '^Test Suites:|^Tests:' /tmp/jest.log | head -4
            grep -qE '^Test Suites: [0-9]+ passed, [0-9]+ total' /tmp/jest.log
            grep -qE '^Tests: +[0-9]+ passed, [0-9]+ total' /tmp/jest.log
            ! grep -qE '^(Test Suites|Tests): .*failed' /tmp/jest.log
            echo TEST-GATE-PASSED
          "

  build-smoke:
    needs: test
    runs-on: nix-capable
    steps:
      - name: Thin-layer build over VNC base
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          docker version --format "server {{.Server.Version}}" || exit 1
          docker image inspect localhost/camofox-browser:135.0.1-x86_64-vnc >/dev/null \
            || { echo "::error::VNC base missing on NAS"; exit 1; }
          TOK=$(cat /jobdata/ci-clone-token)
          rm -rf ci-repo && mkdir ci-repo
          git config --global http.sslVerify false
          git clone --quiet --branch "${{ gitea.ref_name }}" \
            "http://alrcatraz:${TOK}@gitea:3000/${{ gitea.repository }}.git" ci-repo > /tmp/clone.log 2>&1 || { cat /tmp/clone.log; exit 1; }
          cd ci-repo && git checkout --quiet "${{ gitea.sha }}"
          SHA="${{ gitea.sha }}"
          VER=$(grep -oE '"version": *"[^"]+"' package.json | head -1 | cut -d'"' -f4)
          TAG="localhost/camofox-browser:${VER}-x86_64-vnc-ci-${SHA:0:7}"
          echo "TAG=$TAG"
          docker build -f Dockerfile.astra -t "$TAG" . 2>&1 | tail -5

      - name: Smoke — persistence loads + checkpoint persists
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          SHA="${{ gitea.sha }}"
          VER=$(grep -oE '"version": *"[^"]+"' "$PWD/ci-repo/package.json" | head -1 | cut -d'"' -f4)
          TAG="localhost/camofox-browser:${VER}-x86_64-vnc-ci-${SHA:0:7}"
          docker image inspect "$TAG" >/dev/null || { echo "::error::tag $TAG missing"; exit 1; }
          C=$(docker run -d --rm -e CAMOFOX_API_KEY=*** -p 19377:9377 --network gitea_default "$TAG")
          trap 'docker rm -f $C 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 15); do
            sleep 2
            L=$(docker logs $C 2>&1 || true)
            echo "$L" | grep -q 'persistence plugin enabled' && { ok=1; break; }
            echo "$L" | grep -q 'plugin load failed.*persistence' && { echo "::error::persistence load failed"; exit 1; }
          done
          [ -n "$ok" ] || { echo "::error::persistence never loaded"; exit 1; }
          curl -sf -X POST "http://$C:9377/tabs" -H 'Content-Type: application/json' \
            -d '{"userId":"ci_smoke","sessionKey":"s","url":"https://example.com"}' >/dev/null
          sleep 3
          curl -sf -X DELETE "http://$C:9377/sessions/ci_smoke" >/dev/null
          sleep 3
          docker logs $C 2>&1 | grep -q 'storage state persisted' || { echo "::error::checkpoint not persisted"; exit 1; }
          echo SMOKE_OK

      - name: Publish :live tag on NAS
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          SHA="${{ gitea.sha }}"
          VER=$(grep -oE '"version": *"[^"]+"' "$PWD/ci-repo/package.json" | head -1 | cut -d'"' -f4)
          TAG="localhost/camofox-browser:${VER}-x86_64-vnc-ci-${SHA:0:7}"
          docker tag "$TAG" localhost/camofox-browser:live
          echo "Published $TAG as :live (NAS-local)."
