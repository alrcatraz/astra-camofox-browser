name: Build & publish camofox image (astra)

# Gitea-only pipeline, NAS runners. Design decided 2026-09-19 after the baked
# `nixos/nix:runner-ci` image was found wiped by Container Manager GC:
# STOP baking toolchains/secrets into mutable local images. Instead both jobs
# run on nix-capable and drive the NAS docker daemon through the socket that
# act_runner mounts at /var/run/docker.sock — all heavy machinery (node test
# image, VNC base, build cache) lives in the NAS image store under proper tags.
# Secrets come from the host file /volume1/docker/act_runner_nix/data/ci-clone-token,
# which is always available via a helper-container copy (no image baking).
#
# Regression gate: persistence smoke guards the silent plugin-death class
# fixed in 1553c0f (missing mcp/lib/cookies.mjs COPY + logger.info TypeError).

on:
  push:
    branches: [astra]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

env:
  TOKEN_HOST_PATH: /volume1/docker/act_runner_nix/data/ci-clone-token

jobs:
  test:
    runs-on: nix-capable
    steps:
      - name: Unit tests in node:22 container (docker.sock)
        shell: bash
        run: |
          set -euo pipefail
          # job image is minimal alpine+git; everything else happens in containers
          docker version --format "server {{.Server.Version}}" || exit 1
          TOK=$(docker run --rm -v "$TOKEN_HOST_PATH":/tok:ro alpine cat /tok)
          docker run --rm \
            -v camofox-ci-src:/src -v camofox-npm-ci-cache:/root/.npm \
            -w /src \
            -e CI=false \
            -e REPO_URL="http://alrcatraz:${TOK}@gitea:3000/${{ gitea.repository }}.git" \
            -e REF="${{ gitea.ref_name }}" -e SHA="${{ gitea.sha }}" \
            node:22 sh -c "
              rm -rf /src/repo
              git config --global http.sslVerify false
              GIT_SSL_NO_VERIFY=true git clone --branch \$REF \$REPO_URL /src/repo
              cd /src/repo && git checkout \$SHA 2>/dev/null || true
              npm ci --no-audit --no-fund 2>&1 | tail -3
              env NODE_OPTIONS=--experimental-vm-modules npx jest plugins \
                tests/unit --testPathIgnorePatterns='cookies|security|tabRecycling|tabLifecycleContract|operationalFailures|vnc-watcher' \
                --silent --forceExit > /tmp/jest.log 2>&1 || true
              grep -E '^Test Suites:|^Tests:' /tmp/jest.log | head -4
              grep -qE '^Test Suites: [0-9]+ passed, [0-9]+ total' /tmp/jest.log
              grep -qE '^Tests: +[0-9]+ passed, [0-9]+ total' /tmp/jest.log
              ! grep -qE '^(Test Suites|Tests): .*failed' /tmp/jest.log
              echo TEST-GATE-PASSED
            "

  build-smoke:
    needs: test
    runs-on: nix-capable
    steps:
      - name: Clone repo
        shell: bash
        run: |
          set -euo pipefail
          TOK=$(docker run --rm -v "$TOKEN_HOST_PATH":/tok:ro alpine cat /tok)
          # clone via a node:22 container on the SHARED named volume camofox-ci-src
          # (the job's own workspace is an overlay — invisible to sibling containers,
          # which killed run#41's bind mount). node:22-bookworm has git; we also
          # mount the job's git cert helper aside — sslVerify off covers self-signed.
          docker run --rm \
            -v camofox-ci-src:/src -w /src \
            -e REPO_URL="http://alrcatraz:${TOK}@gitea:3000/${{ gitea.repository }}.git" \
            -e REF="${{ gitea.ref_name }}" -e SHA="${{ gitea.sha }}" \
            node:22 sh -c "
              rm -rf /src/repo
              git config --global http.sslVerify false
              GIT_SSL_NO_VERIFY=true git clone --branch \$REF \$REPO_URL /src/repo
              cd /src/repo && git checkout \$SHA 2>/dev/null || true
            "
          echo "SRC_VOL=camofox-ci-src" >> "$GITHUB_ENV"

      - name: Thin-layer build over VNC base
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect localhost/camofox-browser:135.0.1-x86_64-vnc >/dev/null \
            || { echo "::error::VNC base missing on NAS (restore from HC01 podman save/load)"; exit 1; }
          VER=$(docker run --rm -v camofox-ci-src:/src node:22 \
            sh -c "cd /src/repo && grep -oE '\"version\": *\"[^\"]+\"' package.json | head -1" | cut -d'"' -f4)
          SHA="${{ gitea.sha }}"
          TAG="localhost/camofox-browser:${VER}-x86_64-vnc-ci-${SHA:0:7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # build context must live where the daemon can read it: named volume,
          # mounted into a docker:cli container that runs the build itself.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v camofox-ci-src:/src -w /src/repo \
            docker:cli sh -c "docker build -f Dockerfile.astra -t '$TAG' . 2>&1 | tail -5"

      - name: Smoke — persistence loads + checkpoint persists
        shell: bash
        run: |
          set -euo pipefail
          C=$(docker run -d --rm -e CAMOFOX_API_KEY=*** -p 19377:9377 --network gitea_default "$TAG")
          trap 'docker rm -f $C 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 15); do
            sleep 2
            L=$(docker logs $C 2>&1 || true)
            echo "$L" | grep -q 'persistence plugin enabled' && { ok=1; break; }
            echo "$L" | grep -q 'plugin load failed.*persistence' && { echo "::error::persistence load failed"; exit 1; }
          done
          [ -n "$ok" ] || { echo "::error::persistence never loaded"; exit 1; }
          # reach the smoke container over the shared docker network (the job's
          # own 127.0.0.1 is NOT the NAS host namespace)
          curl -sf -X POST "http://$C:9377/tabs" -H 'Content-Type: application/json' \
            -d '{"userId":"ci_smoke","sessionKey":"s","url":"https://example.com"}' >/dev/null
          sleep 3
          curl -sf -X DELETE "http://$C:9377/sessions/ci_smoke" >/dev/null
          sleep 3
          docker logs $C 2>&1 | grep -q 'storage state persisted' || { echo "::error::checkpoint not persisted"; exit 1; }
          echo SMOKE_OK

      - name: Publish :live tag on NAS
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$TAG" localhost/camofox-browser:live
          echo "Published $TAG as :live (NAS-local). HC01 deploy via scripts/deploy-hc01.sh."
