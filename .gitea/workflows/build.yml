name: Build & publish camofox image (astra)

# Flake-era CI (2026-09-20). Label `nix-capable` -> `nixos/nix:runner-ci` =
# official nixos/nix:latest + one /bin/sleep softlink layer (act keepalive
# entrypoint hardcodes it; bare latest won't start — run#54). If CM GC wipes
# the derivative, rebuild ONLY that layer and retag. Toolchain truth for the
# repo itself lives in flake.lock (dev use); CI jobs run heavy lifting inside
# helper containers on the NAS daemon.
#
# Job-image constraints (each proven by a failed run — do not re-litigate):
#   - job fs: NO docker CLI, NO host paths, only grep/cut/tr/tail/head/curl/git
#     (NO sed/python3/awk — run#57) -> dlib uses tr+cut JSON extraction.
#   - drive the NAS daemon via curl --unix-socket /var/run/docker.sock REST;
#     helper containers mount HOST paths fine (daemon-side resolution).
#   - only --network gitea_default resolves gitea:3000.
#   - act format() eats single quotes in run blocks -> double quotes only.
#   - GITHUB_ENV does not carry across steps -> re-derive TAG from disk.
#   - inherited SIGPIPE=ignore + pipefail -> exit 141 -> trap "" PIPE per step.
#   - container.options mounts never reach jobs (runs #41/#45/#55).
#
# Flow: stage repo into volume camofox-ci-src (alpine/git helper) -> jest in
# node:22 on that volume (npm cache volume persists native builds) -> thin-layer
# docker build via docker:cli helper -> smoke -> :live tag.

on:
  push:
    branches: [astra]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

env:
  TOKEN_HOST_PATH: /volume1/docker/act_runner_nix/data/ci-clone-token
  REPO_VOL: camofox-ci-src
  RELAY_HOST_DIR: /volume1/docker/act_runner_nix/data/ci-relay
  NPM_VOL: camofox-npm-ci-cache
  VNC_BASE: localhost/camofox-browser:135.0.1-x86_64-vnc

jobs:
  test:
    runs-on: nix-capable
    steps:
      - name: Setup docker REST helpers
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          cat > "$PWD/dlib.sh" <<'DLIB'
          API="curl -sS --unix-socket /var/run/docker.sock"
          jfield() { grep -oE "[0-9a-f]{64}" | head -1; }
          dcreate() { local out st; out=$($API -w "\n%{http_code}" -X POST -H "Content-Type: application/json" --data-binary "$1" http://localhost/v1.43/containers/create) || { echo "create curl-error" >&2; return 1; }
            st=$(echo "$out" | tail -1); [ "$st" = "201" ] || { echo "create http=$st body=$(echo "$out" | head -1)" >&2; return 1; }
            DR_RAW=$(echo "$out" | jfield Id); [ -n "$DR_RAW" ] || { echo "create no-id: $(echo "$out" | head -1)" >&2; return 1; }; echo "$DR_RAW"; }
          dstart()  { $API -X POST "http://localhost/v1.43/containers/$1/start"; }
          dwait()   { $API "http://localhost/v1.43/containers/$1/wait"; }
          dfmt() { tr "\000-\010" "\n"; }
          drun() { local spec="$1"; local c; local rcs sr
            c=$(dcreate "$spec") || return 1
            if ! $API -f -X POST "http://localhost/v1.43/containers/$c/start" >/dev/null; then echo "start failed cid=$c" >&2; DR_LOG=""; return 1; fi
            rcs=""; i=0; LASTJ=""
            while [ $i -lt 3600 ]; do i=$((i+1)); sleep 1
              J=$($API "http://localhost/v1.43/containers/$c/json") || { echo "json curl-fail try=$i" >&2; continue; }
              LASTJ="$J"
              case "$J" in *page*not*found*) rcs=0; break;; esac
              ST=$(echo "$J" | tr , "\n" | grep Running | head -1)
              case "$ST" in *false*)
                rcs=$(echo "$J" | tr , "\n" | grep ExitCode | grep -oE "[0-9-]+" | tail -1)
                [ -n "$rcs" ] || echo "dwait: Running=false but NO ExitCode field; state=$(echo "$J" | head -c 400)" >&2
                break;;
              esac
            done
            [ -n "$rcs" ] || { echo "TIMEOUT after ${i}s last-json=$(echo "$LASTJ" | head -c 300)" >&2; return 1; }
            echo "drun rc=$rcs cid=$c" >&2
            DR_LOG=$($API "http://localhost/v1.43/containers/$c/logs?stdout=1&stderr=1" | dfmt)
            $API -X DELETE "http://localhost/v1.43/containers/$c?force=true" >/dev/null 2>&1 || true
            echo "$DR_LOG" | tail -12
            DR_CID=$c
            [ "$rcs" = "0" ]; }
          DLIB
          echo dlib-ready

      - name: Stage repo into shared volume
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          . "$PWD/dlib.sh"
          TOKSPEC="{\"Image\":\"node:22\",\"Cmd\":[\"cat\",\"/tok\"],\"HostConfig\":{\"Binds\":[\"$TOKEN_HOST_PATH:/tok:ro\"],\"NetworkMode\":\"none\"}}"
          drun "$TOKSPEC" || { echo "::error::token relay"; exit 1; }
          TOKEN=$(echo "$DR_LOG" | grep -oE "[0-9a-f]{40}" | head -1)
          [ -n "$TOKEN" ] || { echo "::error::empty token (relay rc=$?)"; echo "$DR_LOG" | od -c | head -5; exit 1; }
          SPEC="{\"Image\":\"node:22\",\"Cmd\":[\"sh\",\"-c\",\"echo  | base64 -d > /src/.s.sh; sh /src/.s.sh; sh /src/.s.sh\"],\"Env\":[\"TOKEN=${TOKEN}\",\"SHA=${{ gitea.sha }}\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\",\"$RELAY_HOST_DIR:/relay\"],\"NetworkMode\":\"gitea_default\"}}"

      - name: Jest inside node:22 on shared volume
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          . "$PWD/dlib.sh"
          IGNORE="cookies|security|tabRecycling|tabLifecycleContract|operationalFailures|vnc-watcher"
          # script travels as an Env var (JSON-safe, zero quote nesting);
          # container runs sh -c "$JEST_SCRIPT"
          SPEC="{\"Image\":\"node:22\",\"Cmd\":[\"sh\",\"-c\",\"echo  | base64 -d > /src/.j.sh; sh /src/.j.sh; sh /src/.j.sh\"],\"Env\":[\"CI=false\",\"npm_config_build_from_source=true\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\",\"$RELAY_HOST_DIR:/relay\",\"$NPM_VOL:/root/.npm\"],\"NetworkMode\":\"gitea_default\",\"Memory\":4294967296}}"
          drun "$SPEC" || true
          echo RUN-COMPLETE
          # cat-container removed: DR_LOG must stay the jest container's ASCII summary

          # jest step echoes ONLY the two summary lines (ASCII-clean); cat-container output discarded here
          SUITES_RAW="$DR_LOG"
          SUITES=$(echo "$DR_LOG" | grep "Test Suites:" | head -1)
          TESTS=$(echo "$DR_LOG" | grep -E "^Tests:|Tests: +[0-9]" | head -1)
          echo "SUITES=[$SUITES]"
          echo "TESTS=[$TESTS]"
          case "$SUITES" in *" passed, "*total*) ;; *) echo "::error::no suites summary"; exit 1;; esac
          case "$TESTS" in *" passed, "*total*) ;; *) echo "::error::no tests summary"; exit 1;; esac
          case "$SUITES$TESTS" in *failed*) echo "::error::tests failed"; exit 1;; esac
          echo TEST-GATE-PASSED

  build-smoke:
    needs: test
    runs-on: nix-capable
    steps:
      - name: Setup docker REST helpers
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          cat > "$PWD/dlib.sh" <<'DLIB'
          API="curl -sS --unix-socket /var/run/docker.sock"
          jfield() { grep -oE "[0-9a-f]{64}" | head -1; }
          dcreate() { local out st; out=$($API -w "\n%{http_code}" -X POST -H "Content-Type: application/json" --data-binary "$1" http://localhost/v1.43/containers/create) || { echo "create curl-error" >&2; return 1; }
            st=$(echo "$out" | tail -1); [ "$st" = "201" ] || { echo "create http=$st body=$(echo "$out" | head -1)" >&2; return 1; }
            DR_RAW=$(echo "$out" | jfield Id); [ -n "$DR_RAW" ] || { echo "create no-id: $(echo "$out" | head -1)" >&2; return 1; }; echo "$DR_RAW"; }
          dstart()  { $API -X POST "http://localhost/v1.43/containers/$1/start"; }
          dwait()   { $API "http://localhost/v1.43/containers/$1/wait"; }
          dfmt() { tr "\000-\010" "\n"; }
          drun() { local spec="$1"; local c; local rcs sr
            c=$(dcreate "$spec") || return 1
            if ! $API -f -X POST "http://localhost/v1.43/containers/$c/start" >/dev/null; then echo "start failed cid=$c" >&2; DR_LOG=""; return 1; fi
            rcs=""; i=0; LASTJ=""
            while [ $i -lt 3600 ]; do i=$((i+1)); sleep 1
              J=$($API "http://localhost/v1.43/containers/$c/json") || { echo "json curl-fail try=$i" >&2; continue; }
              LASTJ="$J"
              case "$J" in *page*not*found*) rcs=0; break;; esac
              ST=$(echo "$J" | tr , "\n" | grep Running | head -1)
              case "$ST" in *false*)
                rcs=$(echo "$J" | tr , "\n" | grep ExitCode | grep -oE "[0-9-]+" | tail -1)
                [ -n "$rcs" ] || echo "dwait: Running=false but NO ExitCode field; state=$(echo "$J" | head -c 400)" >&2
                break;;
              esac
            done
            [ -n "$rcs" ] || { echo "TIMEOUT after ${i}s last-json=$(echo "$LASTJ" | head -c 300)" >&2; return 1; }
            echo "drun rc=$rcs cid=$c" >&2
            DR_LOG=$($API "http://localhost/v1.43/containers/$c/logs?stdout=1&stderr=1" | dfmt)
            $API -X DELETE "http://localhost/v1.43/containers/$c?force=true" >/dev/null 2>&1 || true
            echo "$DR_LOG" | tail -12
            DR_CID=$c
            [ "$rcs" = "0" ]; }
          DLIB
          echo dlib-ready

      - name: Thin-layer build over VNC base
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          . "$PWD/dlib.sh"
          $API "http://localhost/images/$VNC_BASE/json" >/dev/null || { echo "::error::VNC base missing on NAS"; exit 1; }
          drun "{\"Image\":\"node:22\",\"Cmd\":[\"sh\",\"-c\",\"echo Y2QgL3NyYyAmJiB0YXIgeHpmIC9yZWxheS9zcmMudGd6IC1DIC9zcmM= | base64 -d | sh\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\",\"$RELAY_HOST_DIR:/relay\"],\"NetworkMode\":\"none\"}}" || true
          drun "{\"Image\":\"node:22\",\"Cmd\":[\"grep\",\"-m1\",\"version\",\"/src/package.json\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\"],\"NetworkMode\":\"none\"}}" || true
          VERSION=$(echo "$DR_LOG" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          [ -n "$VERSION" ] || { echo "::error::no version"; exit 1; }
          SHA="${{ gitea.sha }}"
          TAG="localhost/camofox-browser:${VERSION}-x86_64-vnc-ci-${SHA:0:7}"
          echo "TAG=$TAG"
          drun "{\"Image\":\"docker:cli\",\"Cmd\":[\"docker\",\"build\",\"-f\",\"Dockerfile.astra\",\"-t\",\"$TAG\",\".\"],\"WorkingDir\":\"/src\",\"HostConfig\":{\"Binds\":[\"/var/run/docker.sock:/var/run/docker.sock\",\"$REPO_VOL:/src\"]}}" \
            && echo BUILD_TRIGGERED || { echo "::error::image build failed"; exit 1; }
          $API "http://localhost/images/$TAG/json" >/dev/null || { echo "::error::$TAG missing after build"; exit 1; }
          echo BUILD_OK

      - name: Smoke — persistence loads + checkpoint persists
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          . "$PWD/dlib.sh"
          SHA="${{ gitea.sha }}"
          drun "{\"Image\":\"node:22\",\"Cmd\":[\"sh\",\"-c\",\"echo Y2QgL3NyYyAmJiB0YXIgeHpmIC9yZWxheS9zcmMudGd6IC1DIC9zcmM= | base64 -d | sh\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\",\"$RELAY_HOST_DIR:/relay\"],\"NetworkMode\":\"none\"}}" || true
          drun "{\"Image\":\"node:22\",\"Cmd\":[\"grep\",\"-m1\",\"version\",\"/src/package.json\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\"],\"NetworkMode\":\"none\"}}" || true
          VERSION=$(echo "$DR_LOG" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          TAG="localhost/camofox-browser:${VERSION}-x86_64-vnc-ci-${SHA:0:7}"
          CID=$(dcreate "{\"Image\":\"$TAG\",\"Env\":[\"CAMOFOX_API_KEY=***\"],\"HostConfig\":{\"AutoRemove\":true,\"NetworkMode\":\"bridge\"}}")
          dstart "$CID"
          ok=""
          for i in $(seq 1 15); do
            sleep 2
            $API "http://localhost/v1.43/containers/$CID/logs?stdout=1&stderr=1" > /tmp/smoke.log 2>/dev/null || true
            grep -aq "persistence plugin enabled" /tmp/smoke.log && { ok=1; break; }
            grep -aq "plugin load failed.*persistence" /tmp/smoke.log && { echo "::error::persistence load failed"; tail -20 /tmp/smoke.log | tr -dc "[:print:]\n"; exit 1; }
          done
          [ -n "$ok" ] || { echo "::error::persistence never loaded"; tr -dc "[:print:]\n" < /tmp/smoke.log | tail -30; exit 1; }
          $API "http://localhost/v1.43/containers/$CID/json" > /tmp/cid.json 2>/dev/null || true
          GW=$(tr , "\n" < /tmp/cid.json | grep -m1 Gateway | grep -oE "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+")
          PREFIX=${GW%.*}
          IP="$PREFIX.2"
          echo "SMOKE-GW=$GW IP=$IP (mesh-port trick)"
          echo "SMOKE-IP=$IP"
          TABCODE=$(curl -s -o /tmp/tab.json -w "%{http_code}" -H "Authorization: Bearer ci-smoke-key" -m 120 --retry 5 --retry-delay 5 --retry-all-errors -X POST "http://$IP:9377/tabs" -H "Content-Type: application/json" -d "{\"userId\":\"ci_smoke\",\"sessionKey\":\"s\",\"url\":\"https://example.com\"}")
          [ "$TABCODE" = "200" ] || { echo "::error::tab create http=$TABCODE body=$(head -c 300 /tmp/tab.json)"; $API "http://localhost/v1.43/containers/$CID/logs?stdout=1&stderr=1" > /tmp/smoke.log 2>/dev/null || true; tr -dc "[:print:]\n" < /tmp/smoke.log | tail -30; exit 1; }
          sleep 3
          curl -sf -m 15 -H "Authorization: Bearer ci-smoke-key" -X DELETE "http://$IP:9377/sessions/ci_smoke" >/dev/null
          sleep 3
          $API "http://localhost/v1.43/containers/$CID/logs?stdout=1&stderr=1" > /tmp/smoke.log 2>/dev/null || true
          grep -aq "storage state persisted" /tmp/smoke.log || { echo "::error::checkpoint not persisted"; tail -30 /tmp/smoke.log | tr -dc "[:print:]\n"; exit 1; }
          $API -X DELETE "http://localhost/v1.43/containers/$CID?force=true" >/dev/null || true
          echo SMOKE_OK

      - name: Publish :live tag on NAS
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          . "$PWD/dlib.sh"
          SHA="${{ gitea.sha }}"
          drun "{\"Image\":\"node:22\",\"Cmd\":[\"sh\",\"-c\",\"echo Y2QgL3NyYyAmJiB0YXIgeHpmIC9yZWxheS9zcmMudGd6IC1DIC9zcmM= | base64 -d | sh\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\",\"$RELAY_HOST_DIR:/relay\"],\"NetworkMode\":\"none\"}}" || true
          drun "{\"Image\":\"node:22\",\"Cmd\":[\"grep\",\"-m1\",\"version\",\"/src/package.json\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\"],\"NetworkMode\":\"none\"}}" || true
          VERSION=$(echo "$DR_LOG" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          TAG="localhost/camofox-browser:${VERSION}-x86_64-vnc-ci-${SHA:0:7}"
          $API -X POST "http://localhost/images/$TAG/tag?repo=localhost/camofox-browser&tag=live" >/dev/null
          echo "Published $TAG as :live (NAS-local)."
      - name: Cleanup shared artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          trap "" PIPE
          . "$PWD/dlib.sh"
          # wipe the shared src volume AND the persistent relay tarball so no
          # artifact bleeds between runs (user directive 2026-09-21)
          drun "{\"Image\":\"node:22\",\"Cmd\":[\"sh\",\"-c\",\"rm -rf /src/* /src/.[!.]* /relay/src.tgz 2>/dev/null; echo CLEANED\"],\"HostConfig\":{\"Binds\":[\"$REPO_VOL:/src\",\"$RELAY_HOST_DIR:/relay\"],\"NetworkMode\":\"none\"}}" || true
          case "$DR_LOG" in *CLEANED*) echo CLEANUP-OK;; *) echo "::warning::cleanup unverified";; esac
