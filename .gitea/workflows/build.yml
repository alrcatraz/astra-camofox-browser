name: Build & publish camofox image (astra)

# Toolchain = repo flake.nix + committed flake.lock, evaluated inside the
# `nixos` label (nixos/nix:runner-ci2). No apt/npm-image toolchain drift.
# Runner config gives jobs: docker-socket mount (/var/run/docker.sock =
# NAS podman's docker-compat REST API), privileged, network_mode=host
# (docs.gitea.com/runner/configuration). Image build/publish talks over the
# mounted socket via the flake-pinned `docker` CLI straight against it (DooD) —
# no throwaway docker:cli relay containers, no nested-engine dependency. The
# NAS engine is podman serving the docker-compat API.
#
# Flow: checkout -> nix develop (flake ci shell): npm ci + jest gates ->
# thin-layer build over VNC base -> smoke (persistence load + checkpoint
# persist) -> :live tag -> prune stale ci tags.

on:
  push:
    branches: [astra, development]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

env:
  VNC_BASE: localhost/camofox-browser:135.0.1-x86_64-vnc
  # multi-line required: single-line space-separated NIX_CONFIG silently keeps
  # defaults for later keys (sandbox/filter-syscalls ignored -> seccomp BPF fail)
  # No access-tokens here on purpose: flake.lock pins all inputs to public
  # GitHub tarballs, which fetch anonymously — a token would only re-expose CI
  # to GitHub's secret-scanning revocations (the historical reason this line
  # ever existed was private-repo inputs, which we do not have).
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false
    filter-syscalls = false

jobs:
  test:
    runs-on: nixos
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          echo "ENV-PROBE-START"
          for v in $(compgen -v); do
            case "$v" in *TOKEN*|*GITEA*|*GITHUB*) echo "VAR:$v";; esac
          done
          echo "ENV-PROBE-END"
          # Native git clone instead of actions/checkout: that action is a Node
          # program, so it needs node inside the RUNNER image — a toolchain we
          # do not control (a runner-image rebuild silently dropped it once).
          # Everything the job needs must come from the repo flake, so we clone
          # with the git the runner image already ships, authenticating with the
          # job token the runner injects.
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          AUTH_URL=$(printf '%s' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" | sed "s|://|://x-access-token:${GITHUB_TOKEN}@|")
          git remote add origin "$AUTH_URL"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

      - name: Flake devShell gate
        run: |
          set -euo pipefail
          git add -N flake.nix || true
          nix develop .#ci --command bash -c 'node --version && npm --version && gcc --version | head -1'

      - name: npm ci (in flake shell)
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c 'HOME=/tmp npm ci --no-audit --no-fund'

      - name: Jest (unit + plugins, in flake shell)
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            HOME=/tmp NODE_OPTIONS=$NODE_OPTIONS node ./node_modules/.bin/jest plugins tests/unit \
              --testPathIgnorePatterns cookies security tabRecycling tabLifecycleContract operationalFailures vnc-watcher \
              --silent --forceExit 2>&1 | tee /tmp/jest.out
            grep -E "Test Suites:" /tmp/jest.out
            grep -E "^Tests:" /tmp/jest.out
            SUITES=$(grep -E "Test Suites:" /tmp/jest.out | head -1)
            TESTS=$(grep -E "^Tests:" /tmp/jest.out | head -1)
            case "$SUITES$TESTS" in *failed*) echo "::error::tests failed"; exit 1;; esac
            case "$SUITES" in *" passed, "*total*) ;; *) echo "::error::no suites summary"; exit 1;; esac
            echo TEST-GATE-PASSED
          '

  build-smoke:
    needs: test
    runs-on: nixos
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          # Native git clone — see the test job for why actions/checkout is not used.
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          AUTH_URL=$(printf '%s' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" | sed "s|://|://x-access-token:${GITHUB_TOKEN}@|")
          git remote add origin "$AUTH_URL"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

      - name: Flake devShell gate (incl. docker client)
        run: |
          set -euo pipefail
          git add -N flake.nix || true
          nix develop .#ci --command bash -c 'node --version && git --version && docker --version'

      - name: Docker-API socket probe (DooD on shared socket)
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            export DOCKER_HOST="unix:///var/run/docker.sock"
            docker version >/dev/null && echo DOCKER-SOCKET-OK
          '

      - name: Thin-layer build over VNC base
        run: |
          set -euo pipefail
          VERSION=$(grep -oE '"version": *"[0-9]+\.[0-9]+\.[0-9]+"' package.json | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          [ -n "$VERSION" ] || { echo "::error::no version"; exit 1; }
          SHA="${{ gitea.sha }}"
          TAG="localhost/camofox-browser:${VERSION}-x86_64-vnc-ci-${SHA:0:7}"
          # GITHUB_ENV is not honored by act here -> persist via file
          echo "$TAG" > /tmp/ci_tag
          nix develop .#ci --command bash -c "
            export DOCKER_HOST='unix:///var/run/docker.sock'
            docker image inspect '$VNC_BASE' >/dev/null 2>&1 || { echo '::error::VNC base missing on NAS'; docker images | grep camofox | head -5; exit 1; }
            # Dockerfile.astra is a thin layer over the VNC base (which carries its own
            # node_modules); CI checkout has none, so drop that COPY for the CI build.
            grep -v '^COPY node_modules' Dockerfile.astra > Dockerfile.ci
            # The engine lives on the NAS host; the job workspace is a host bind
            # volume whose path is valid there too, so the socket API can use it
            # as build context directly.
            docker build -f '$GITHUB_WORKSPACE/Dockerfile.ci' -t '$TAG' '$GITHUB_WORKSPACE'
            echo BUILD_OK
          "

      - name: Smoke — persistence loads + checkpoint persists
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/ci_tag)
          # Script piped to `bash -s` INSIDE the flake shell via a QUOTED heredoc:
          # zero expansion in the workflow layer -> no outer/inner escaping ladders.
          # The smoke key comes from a repo secret expanded by the runner BEFORE the
          # script hits disk, so no credential-shaped literal ever appears in the
          # executed script (Gitea's log scrubber rewrites such literals in place and
          # would otherwise corrupt the value mid-flight).
          SMOKE_SECRET='${{ secrets.SMOKE_TEST_KEY }}' \
            nix develop .#ci --command bash -s "$TAG" <<'SMOKE_EOF'
          set -euo pipefail
          export DOCKER_HOST='unix:///var/run/docker.sock'
          TAG="$1"
          # Auth: the key is injected via -e and referenced as a runtime variable in
          # the request header. The runner reaches the container over the bridge
          # network, so the loopback exemption in lib/auth.js does not apply.
          TESTKEY="$SMOKE_SECRET"
          CID=$(docker create --rm --label ci-smoke=1 \
            -e CAMOFOX_API_KEY="$TESTKEY" -e CAMOFOX_ACCESS_KEY="$TESTKEY" "$TAG")
          trap "docker rm -f $CID >/dev/null 2>&1 || true" EXIT
          docker start "$CID" >/dev/null
          sleep 5
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CID" | tr -d '\n')
          [ -n "$IP" ] || { echo '::error::no ip'; docker logs "$CID" | tail -30; exit 1; }
          ok=''
          for i in $(seq 1 15); do
            sleep 2
            docker logs "$CID" 2>&1 | grep -q 'persistence plugin enabled' && { ok=1; break; }
            docker logs "$CID" 2>&1 | grep -q 'plugin load failed.*persistence' && { echo '::error::persistence load failed'; docker logs "$CID" | tail -20; exit 1; }
          done
          [ -n "$ok" ] || { echo '::error::persistence never loaded'; docker logs "$CID" | tail -30; exit 1; }
          TABCODE=$(curl -s -o /tmp/tab.json -w '%{http_code}' -m 120 --retry 5 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer ***" -X POST "http://$IP:9377/tabs" -H 'Content-Type: application/json' -d '{"userId":"ci_smoke","sessionKey":"s","url":"https://example.com"}')
          [ "$TABCODE" = '200' ] || { echo "::error::tab create http=$TABCODE body=$(head -c 300 /tmp/tab.json)"; docker logs "$CID" | tail -30; exit 1; }
          sleep 3
          curl -sf -m 15 -H "Authorization: Bearer ***" -X DELETE "http://$IP:9377/sessions/ci_smoke" >/dev/null
          sleep 3
          docker logs "$CID" 2>&1 | grep -q 'storage state persisted' || { echo '::error::checkpoint not persisted'; docker logs "$CID" | tail -30; exit 1; }
          docker rm -f "$CID" >/dev/null 2>&1 || true
          trap - EXIT
          echo SMOKE_OK
          SMOKE_EOF

      - name: Publish :live + version tags on NAS
        run: |
          set -euo pipefail
          TAG=$(cat /tmp/ci_tag)
          nix develop .#ci --command bash -c "
            set -euo pipefail
            export DOCKER_HOST='unix:///var/run/docker.sock'
            docker tag '$TAG' localhost/camofox-browser:live
            # release.yml builds its own image from the tag checkout; reuse it here so
            # a git tag costs one build, not two (same commit = same layers)
            if V=\$(git describe --tags --exact-match 2>/dev/null); then
              PV=\$(node -p \"require('./package.json').version\")
              [ \"\$V\" = \"\$PV\" ] || { echo \"::error::tag \$V != package.json version \$PV — bump package.json on the tagged commit\"; exit 1; }
              docker tag '$TAG' \"localhost/camofox-browser:\$V\"
              echo \"Also tagged $TAG as :\$V\"
            fi
            # drop stale per-commit CI tags so storage doesn't bloat
            for t in \$(docker images --format '{{.Tag}}' localhost/camofox-browser | grep -E '^1\.[0-9]+\.[0-9]+-x86_64-vnc-ci-' | grep -v '${TAG##*:}'); do
              docker rmi \"localhost/camofox-browser:\$t\" >/dev/null 2>&1 || true
            done
            echo \"Published $TAG as :live (NAS-local); old ci tags pruned.\"
          "