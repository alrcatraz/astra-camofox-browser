name: Build & publish camofox image (astra)

# Gitea-only pipeline. NAS runners ONLY (GitHub's .github/workflows belong to
# upstream and are NOT used for astra builds):
#   - nix-capable = ds425plus-nix; job container defaults to the runner's
#     nixos/nix:runner image (runner-mounted /jobdata/ci-clone-token + baked /bin/sleep). node
#     toolchain comes from a nix profile baked by scripts/bake-node-ci-image.sh,
#     exposed via NIX_PATH profile activation below.
#   - host = steps run directly on the DSM host (docker CLI + local images).
#
# Regression gate: persistence smoke guards the silent plugin-death class
# fixed in 1553c0f (missing mcp/lib/cookies.mjs COPY + logger.info TypeError).

on:
  push:
    branches: [astra]
  workflow_dispatch: {}

concurrency:
  group: camofox-image-build
  cancel-in-progress: false

jobs:
  test:
    runs-on: nix-capable
    steps:
      - name: Checkout & unit tests
        shell: bash
        run: |
          set -euo pipefail
          # DIAGNOSTIC RUN: print every line's exit status instead of dying silently.
          _step() { echo "STEP[$1]"; }
          TOK=$(cat /root/ci-clone-token); echo "TOK_LEN=${#TOK}"
          git config --global http.sslVerify false
          rm -rf /workspace/repo
          # container runs on gitea_default net -> talk to gitea directly (no Lucky round-trip)
          git clone --branch "${{ gitea.ref_name }}" \
            "http://alrcatraz:${TOK}@gitea:3000/${{ gitea.repository }}.git" /workspace/repo
          cd /workspace/repo
          git checkout "${{ gitea.sha }}" 2>/dev/null || true
          # activate the baked ci-cache profile (nodejs_22 python3 gcc gnumake git curl)
          export PATH=/nix/var/nix/profiles/ci-cache/bin:$PATH
          export npm_config_build_from_source=true
          npm ci --no-audit --no-fund 2>&1 | tail -3
          # ESM tests need --experimental-vm-modules (same as npm run test:plugins).
          # Camoufox-binary-dependent suites can only pass where the browser exists.
          # CLI --testPathIgnorePatterns REPLACES config patterns — repeat every exclusion here.
          # ALL double quotes: act's format() rewrite collapses single quotes.
          env NODE_OPTIONS="--experimental-vm-modules" npx jest plugins \
            tests/unit --testPathIgnorePatterns="cookies|security|tabRecycling|tabLifecycleContract|operationalFailures|vnc-watcher" \
            --silent --forceExit > /tmp/jest.log 2>&1 || true
          # DIAGNOSTIC GATE: trap prints the exact line that killed the step.
          trap "echo TRAP: step died at line \$LINENO" ERR
          set -E
          cat -A /tmp/jest.log | grep -E "Test Suites|Tests:" | head -4
          grep -qE "^Test Suites: [0-9]+ passed, [0-9]+ total" /tmp/jest.log
          grep -qE "^Tests: +[0-9]+ passed, [0-9]+ total" /tmp/jest.log
          ! grep -qE "^(Test Suites|Tests): .*failed" /tmp/jest.log
          echo TEST-GATE-PASSED

  build-smoke:
    needs: test
    # "host" is NOT a registered label on this Gitea (act_runner = ubuntu-latest/
    # ubuntu-24.04/rust; act_runner_nix = nix-capable/nixos) -> queued forever.
    # Route to the plain NAS runner; its job containers get docker.sock mounted
    # by act_runner, so `docker` CLI drives the NAS daemon from inside the job.
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo (job container, docker.sock available)
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest image has no baked creds. Job cwd is a named docker
          # volume; copy the host token file into it with a helper container on
          # the NAS daemon (socket mounted here): mounting the VOLUME by name
          # resolves host-side for us — no path guessing needed.
          JOBID=$(grep -oE "[0-9a-f]{64}" /proc/self/cgroup | head -1)
          VOL=$(docker inspect "$JOBID" --format "{{range .Mounts}}{{if eq .Destination \"/workspace/alrcatraz/astra-camofox-browser\"}}{{.Name}}{{end}}{{end}}")
          echo "JOBID=$JOBID JOB_VOL=$VOL"
          docker run --rm \
            -v /volume1/docker/act_runner_nix/data/ci-clone-token:/tok:ro \
            -v "$VOL":/shared \
            alpine sh -c "cp /tok /shared/.ci-token"
          TOK=$(cat "$PWD/.ci-token")
          rm -rf "$PWD/ci-repo"
          git config --global http.sslVerify false
          GIT_SSL_NO_VERIFY=true git clone --branch "${{ gitea.ref_name }}" \
            "http://alrcatraz:${TOK}@gitea:3000/${{ gitea.repository }}.git" "$PWD/ci-repo"
          cd "$PWD/ci-repo" && git checkout "${{ gitea.sha }}" 2>/dev/null || true
          echo "WORK=$PWD/ci-repo" >> "$GITHUB_ENV"

      - name: Thin-layer build over VNC base
        shell: bash
        run: |
          set -euo pipefail
          # docker CLI comes from the ubuntu-latest runner image; it talks to the
          # NAS daemon through the mounted socket. The VNC base + node toolchain
          # only exist on act_runner_nix's host image store — same NAS daemon, so
          # localhost/ tags are visible here too.
          which docker || { echo "::error::no docker cli in job image"; exit 1; }
          cd "$WORK"
          VER=$(grep -oE '"version": *"[^"]+"' package.json | head -1 | cut -d'"' -f4)
          SHA=$(git rev-parse --short HEAD)
          TAG="localhost/camofox-browser:${VER}-x86_64-vnc-ci-${SHA}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f Dockerfile.astra -t "$TAG" . 2>&1 | tail -5

      - name: Smoke — persistence loads + checkpoint persists
        shell: bash
        run: |
          set -euo pipefail
          C=$(docker run -d --rm -e CAMOFOX_API_KEY=*** -p 19377:9377 "$TAG")
          trap 'docker rm -f $C 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 15); do
            sleep 2
            L=$(docker logs $C 2>&1 || true)
            echo "$L" | grep -q 'persistence plugin enabled' && { ok=1; break; }
            echo "$L" | grep -q 'plugin load failed.*persistence' && { echo "::error::persistence load failed"; exit 1; }
          done
          [ -n "$ok" ] || { echo "::error::persistence never loaded"; exit 1; }
          curl -sf -X POST http://127.0.0.1:19377/tabs -H 'Content-Type: application/json' \
            -d '{"userId":"ci_smoke","sessionKey":"s","url":"https://example.com"}' >/dev/null
          sleep 3
          curl -sf -X DELETE http://127.0.0.1:19377/sessions/ci_smoke >/dev/null
          sleep 3
          docker logs $C 2>&1 | grep -q 'storage state persisted' || { echo "::error::checkpoint not persisted"; exit 1; }
          echo SMOKE_OK

      - name: Publish :live tag on NAS
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$TAG" localhost/camofox-browser:live
          echo "Published $TAG as :live (NAS-local). HC01 deploy via scripts/deploy-hc01.sh."
